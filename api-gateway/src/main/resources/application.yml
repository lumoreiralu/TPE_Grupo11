server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1. Eventos y Catálogo
            - id: eventos-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/eventos/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: eventService
                    fallbackUri: forward:/fallback/eventos
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT

            - id: lugares-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/lugares/**

            # 2. Compras y Reservas
            - id: compras-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/compras/**

            # 3. Entradas y QR
            - id: entradas-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/entradas/**

            # 4. Pasarela de Pagos Mock
            - id: pasarela-mock-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/pagos/**
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: redis
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: "ticketya-secret-key-for-jwt-signing-2024"
  expiracion: 3600000

resilience4j:
  circuitbreaker:
    instances:
      eventService:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      eventService:
        timeout-duration: 1500ms

            # 2b. Fila virtual (compras-service)
            - id: fila-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/fila/**
