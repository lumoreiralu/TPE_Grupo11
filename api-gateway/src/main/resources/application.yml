server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1. Eventos y Catálogo
            - id: eventos-service
              uri: ${APP_SERVICES_EVENTOS_URL:http://localhost:8081}
              predicates:
                - Path=/api/eventos/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: eventService
                    fallbackUri: forward:/fallback/eventos
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT

            - id: lugares-service
              uri: ${APP_SERVICES_EVENTOS_URL:http://localhost:8081}
              predicates:
                - Path=/api/lugares/**

            # 2. Compras y Reservas
            - id: compras-service
              uri: ${APP_SERVICES_COMPRAS_URL:http://localhost:8082}
              predicates:
                - Path=/api/compras/**

            # 2b. Fila virtual (compras-service)
            - id: fila-service
              uri: ${APP_SERVICES_COMPRAS_URL:http://localhost:8082}
              predicates:
                - Path=/api/fila/**

            # 3. Entradas y QR
            - id: entradas-service
              uri: ${APP_SERVICES_ENTRADAS_URL:http://localhost:8083}
              predicates:
                - Path=/api/entradas/**

            # 4. Pasarela de Pagos Mock
            - id: pasarela-mock-service
              uri: ${APP_SERVICES_PASARELA_URL:http://localhost:8084}
              predicates:
                - Path=/api/pagos/**
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:ticketya-secret-key-for-jwt-signing-2024}
  expiracion: ${JWT_EXPIRACION:3600000}

resilience4j:
  circuitbreaker:
    instances:
      eventService:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      eventService:
        timeout-duration: 1500ms
