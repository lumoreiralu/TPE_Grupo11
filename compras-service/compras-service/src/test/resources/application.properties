spring.datasource.url=jdbc:h2:mem:compras_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.services.eventos.url=http://localhost:65535
app.services.pasarela.url=http://localhost:65535
app.services.entradas.url=http://localhost:65535
compras.reserva.minutos=10
compras.limite-entradas-por-cliente=4
spring.data.redis.repositories.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
management.endpoints.web.exposure.include=health
compras.fila.modo=NORMAL
compras.fila.umbral=50
compras.fila.pase-ttl-segundos=600
# Evita conexión real a Redis en tests; FilaVirtualService tolera template nulo y se mockea donde aplica
spring.data.redis.host=localhost
spring.data.redis.port=0
spring.data.redis.timeout=100ms
