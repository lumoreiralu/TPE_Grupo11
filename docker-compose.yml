version: '3.8'

services:
  # Base de datos NoSQL para el Servicio de Eventos y Catálogo
  mongo-eventos:
    image: mongo:latest
    container_name: ticketya-mongo-eventos
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Base de datos Relacional para Compras y Entradas
  postgres-db:
    image: postgres:15-alpine
    container_name: ticketya-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: db_ticketya
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  # Buzón de correo local para notificaciones (SMTP 1025 / UI http://localhost:8025)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ticketya-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
  postgres_data: