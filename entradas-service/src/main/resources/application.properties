spring.application.name=entradas-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_entradas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.services.compras.url=${APP_SERVICES_COMPRAS_URL:http://localhost:8082}
app.services.eventos.url=${APP_SERVICES_EVENTOS_URL:http://localhost:8081}
app.services.pasarela.url=${APP_SERVICES_PASARELA_URL:http://localhost:8084}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.endpoints.web.exposure.include=health
# La caída de MailHog no debe marcar el servicio como DOWN: las notificaciones son asíncronas.
management.health.mail.enabled=false

# Notificaciones por correo (MailHog en local: SMTP 1025, UI http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
notificaciones.remitente=${NOTIFICACIONES_REMITENTE:no-reply@ticketya.com}
notificaciones.dominio-email=${NOTIFICACIONES_DOMINIO_EMAIL:ticketya.com}
notificaciones.reintentos=${NOTIFICACIONES_REINTENTOS:3}
notificaciones.reintento-espera-ms=${NOTIFICACIONES_REINTENTO_ESPERA_MS:1000}

# Orden de aspectos: CircuitBreaker (1) -> Retry (2) -> TimeLimiter (3)
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2
resilience4j.timelimiter.time-limiter-aspect-order=3

# Servicio de compras (liberar asientos): 3 intentos, timeout 2 s
resilience4j.circuitbreaker.instances.comprasService.sliding-window-size=10
resilience4j.circuitbreaker.instances.comprasService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.comprasService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.comprasService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.comprasService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.comprasService.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.retry.instances.comprasService.max-attempts=3
resilience4j.retry.instances.comprasService.wait-duration=500ms
resilience4j.retry.instances.comprasService.retry-exceptions[0]=com.ticketya.entradas.client.RemoteServiceException
resilience4j.retry.instances.comprasService.retry-exceptions[1]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.comprasService.retry-exceptions[2]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.comprasService.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.timelimiter.instances.comprasService.timeout-duration=2s

# Servicio de eventos: 2 intentos, timeout 2 s, CB 50% sobre 10 llamadas, 15 s abierto
resilience4j.circuitbreaker.instances.eventService.sliding-window-size=10
resilience4j.circuitbreaker.instances.eventService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.eventService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.eventService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.eventService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.eventService.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.retry.instances.eventService.max-attempts=2
resilience4j.retry.instances.eventService.wait-duration=500ms
resilience4j.retry.instances.eventService.retry-exceptions[0]=com.ticketya.entradas.client.RemoteServiceException
resilience4j.retry.instances.eventService.retry-exceptions[1]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.eventService.retry-exceptions[2]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.eventService.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.timelimiter.instances.eventService.timeout-duration=2s

# Pasarela de pagos (reembolsos best-effort): 3 intentos, timeout 2 s
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentGateway.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentGateway.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.retry.instances.paymentGateway.max-attempts=3
resilience4j.retry.instances.paymentGateway.wait-duration=500ms
resilience4j.retry.instances.paymentGateway.retry-exceptions[0]=com.ticketya.entradas.client.RemoteServiceException
resilience4j.retry.instances.paymentGateway.retry-exceptions[1]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.paymentGateway.retry-exceptions[2]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.paymentGateway.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.timelimiter.instances.paymentGateway.timeout-duration=2s
