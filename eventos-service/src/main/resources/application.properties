spring.application.name=eventos-service
server.port=${SERVER_PORT:8081}

# Spring Boot 4 usa spring.mongodb.* (módulo org.springframework.boot.mongodb);
# se mantienen ambas claves y ambos env vars por compatibilidad.
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/db_eventos}}
spring.data.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/db_eventos}}

app.services.entradas.url=${APP_SERVICES_ENTRADAS_URL:http://localhost:8083}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.endpoints.web.exposure.include=health

# Orden de aspectos: CircuitBreaker (1) -> Retry (2) -> TimeLimiter (3)
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2
resilience4j.timelimiter.time-limiter-aspect-order=3

# Servicio de entradas: 3 intentos, timeout 2 s, CB 50% sobre 10 llamadas
resilience4j.circuitbreaker.instances.ticketService.sliding-window-size=10
resilience4j.circuitbreaker.instances.ticketService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.ticketService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ticketService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ticketService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ticketService.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.retry.instances.ticketService.max-attempts=3
resilience4j.retry.instances.ticketService.wait-duration=500ms
resilience4j.retry.instances.ticketService.retry-exceptions[0]=ticketya.eventos_service.client.RemoteServiceException
resilience4j.retry.instances.ticketService.retry-exceptions[1]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.ticketService.retry-exceptions[2]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.ticketService.ignore-exceptions[0]=org.springframework.web.server.ResponseStatusException
resilience4j.timelimiter.instances.ticketService.timeout-duration=2s
